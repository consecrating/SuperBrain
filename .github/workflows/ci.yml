name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint every shell script
        run: |
          # This repo's entire job is running shell that mutates a global config
          # directory. Unreviewed shell is the main risk, so lint it all.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning --external-sources

  smoke:
    name: smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run smoke tests
        run: bash tests/smoke.sh

  manifest:
    name: manifest is the source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: manifest.json parses and every repo is complete
        run: |
          python3 - <<'PY'
          import json, sys

          with open("manifest.json", encoding="utf-8") as fh:
              m = json.load(fh)

          errors: list[str] = []
          seen: set[str] = set()

          for repo in m.get("repositories", []):
              name = repo.get("name")
              if not name:
                  errors.append("a repository entry has no name")
                  continue
              if name in seen:
                  errors.append(f"{name}: duplicate entry")
              seen.add(name)
              for key in ("github", "priority", "install", "verify"):
                  if key not in repo:
                      errors.append(f"{name}: missing required key '{key}'")
              if not repo.get("verify"):
                  errors.append(f"{name}: 'verify' must not be empty")

          prios = [r.get("priority") for r in m.get("repositories", [])]
          if len(set(prios)) != len(prios):
              errors.append(f"duplicate priorities: {prios}")

          if "self" not in m:
              errors.append("manifest is missing the 'self' entry")

          if errors:
              print("manifest validation FAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print(f"manifest OK — {len(seen)} repositories, priorities unique")
          PY

      - name: scripts contain no hardcoded per-repo install logic
        run: |
          # The whole point of v2: bootstrap.sh must not know how to install any
          # specific repo. If these strings come back, logic has leaked out of
          # manifest.json again.
          if grep -nE 'pip install -e .*(ScrapeToolAi|goaaiseo)|All-Skills/install\.sh|Claude-Power/\.kiro' scripts/*.sh; then
            echo "::error::per-repo install logic found in scripts/ — it belongs in manifest.json"
            exit 1
          fi
          echo "no hardcoded per-repo logic in scripts/"
